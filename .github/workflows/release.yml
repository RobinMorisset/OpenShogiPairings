name: Release desktop apps

# Build the Windows .exe and the macOS app and publish them to a GitHub Release.
#
# Trigger by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# You can also run it by hand from the Actions tab (workflow_dispatch) to test
# without cutting a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload the installers

jobs:
  # Fail fast (before spinning up the build runners) if a release tag doesn't
  # match the version the app actually reports. Skipped on manual dispatch,
  # which has no tag.
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match every version-bearing file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version frontend/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version frontend/package.json)
          # The Rust workspace version feeds osp_core::VERSION (the /api/health
          # payload and the client's "server upgraded" check), so it must match
          # the tag too. It's the first `version = "..."` under
          # [workspace.package] in the root Cargo.toml.
          ws=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          # The desktop crate is excluded from the workspace, so it carries its
          # own [package] version — the first `version = "..."` in its manifest.
          crate=$(grep -m1 '^version = ' frontend/src-tauri/Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "tag=$tag  Cargo.toml=$ws  src-tauri/Cargo.toml=$crate  tauri.conf.json=$conf  package.json=$pkg"
          if [ "$tag" != "$ws" ] || [ "$tag" != "$crate" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match versions (Cargo.toml=$ws, src-tauri/Cargo.toml=$crate, tauri.conf.json=$conf, package.json=$pkg). Bump all four and re-tag."
            exit 1
          fi

  # Create the draft release once, up front, so the two build runners upload to
  # the *same* release instead of each racing to create one — that race is what
  # produced duplicate per-platform releases. Only on a real tag; on manual
  # dispatch there is no tag and nothing to publish to.
  create-release:
    needs: check-version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
            --title "OpenShogiPairings $tag" \
            --notes "See the assets below to download and install OpenShogiPairings."
          id=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [check-version, create-release]
    # Run once the checks pass. On manual dispatch both check-version and
    # create-release are skipped (no tag), and the build still runs — with an
    # empty releaseId, so tauri-action builds without publishing, to exercise the
    # pipeline.
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A single universal binary that runs on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS arches so `--target universal-apple-darwin` can link them.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          # Upload into the single draft release created by `create-release`,
          # rather than creating one here (which raced across the two runners).
          # Empty on manual dispatch → tauri-action builds without publishing.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
