name: CI

# Lint and test on every push and pull request — the same checks the local git
# hooks (scripts/git-hooks/) run, but on a clean checkout so a missing hook, an
# uncommitted file, a stale lockfile, or a "works on my machine" gap can't slip a
# red build onto a branch unnoticed.
#
# Note: this *reports* status, it does not block a push — direct pushes still
# land, and a failure just marks the commit red. To make it a hard gate, require
# these checks under branch protection (which gates pull-request merges).

on:
  push:
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Rust: formatting, lint, docs, and the full workspace test suite. `--locked`
  # makes a stale root Cargo.lock fail here (the lockfile-drift the pre-commit hook
  # guards against locally). The excluded desktop crate (frontend/src-tauri) is not
  # built here — it's covered by the release workflow.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
      - name: Format (cargo fmt)
        run: cargo fmt --all --check
      - name: Lint (clippy, warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Rustdoc warnings don't fail a build on their own, so a link that stopped
      # resolving is invisible until someone follows it. `--document-private-items`
      # because much of the explanation lives on private items, and rustdoc only
      # checks links in what it documents. Same command as the pre-push hook.
      - name: Docs (rustdoc, warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - name: Test
        run: cargo test --workspace --locked
      # The tests above are what write frontend/src/lib/generated/, so this costs
      # a `git diff` and nothing else — those files were rewritten seconds ago by
      # the run that just finished.
      #   Until now this lived only in the pre-push hook, which is opt-in per
      #   clone (`git config core.hooksPath`, see the README) and skippable with
      #   --no-verify. Nothing here caught the drift: clippy does not regenerate,
      #   and the frontend job type-checks a fresh checkout against the
      #   *committed* bindings — so a stale copy stays green while the wire format
      #   and the TypeScript types disagree, and the mismatch surfaces at runtime
      #   instead.
      #   `--others` as well as the diff: a newly exported type writes a file git
      #   has never seen, which `git diff` alone would not report.
      - name: ts-rs bindings up to date
        run: |
          untracked=$(git ls-files --others --exclude-standard -- frontend/src/lib/generated)
          if ! git diff --quiet -- frontend/src/lib/generated || [ -n "$untracked" ]; then
            echo "::error file=frontend/src/lib/generated::A Rust type changed without its TypeScript binding following. Run 'cargo test --workspace' and commit frontend/src/lib/generated/."
            git --no-pager diff -- frontend/src/lib/generated
            for f in $untracked; do echo "new, uncommitted binding: $f"; done
            exit 1
          fi
          echo "bindings match the committed files"

  # The declared MSRV is real: build the workspace on exactly the toolchain
  # `rust-version` in Cargo.toml names. Every other Rust job here runs `stable`,
  # so without this nothing ever compiles against the old toolchain and the
  # number is free to be wrong — which is how the README came to claim 1.77 while
  # the graph had needed 1.90 for some time. The version is read from the
  # manifest rather than written here, so there is still one place to change it;
  # a dependency bump that raises the real floor fails this job instead of
  # silently invalidating the docs. The fix when it fails is a decision, not a
  # formality: raise `rust-version` (and tell users), or pin the dependency back.
  #
  # `cargo check` without `--all-targets`, so dev-dependencies don't gate the
  # MSRV — what matters is that someone on 1.90 can *build and depend on* these
  # crates, not that the test harness compiles there. No rust-cache: this
  # toolchain's artifacts would otherwise evict the stable ones the other jobs
  # share, and a cold check is cheaper than that.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name == "osp-core") | .rust_version')
          test -n "$v" && test "$v" != null  # fail loud rather than install "stable"
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Check (workspace builds on the declared MSRV)
        run: cargo check --workspace --locked

  # Frontend: type-check, lint, unit tests, and the i18n locale-key parity check.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          # Must satisfy frontend/package.json's `engines` (jsdom 30 is the
          # binding constraint). With engine-strict in frontend/.npmrc, a version
          # that doesn't fails `npm ci` here rather than surfacing as a cryptic
          # TypeError inside the one jsdom-environment test.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # `build`, not `check`: the former is `svelte-check && vite build`, so this
      # is a superset of the type-check for ~2s more. Without it nothing here
      # ever bundles, and a failure that type-checks but does not build — an
      # unresolvable dynamic import, a rollup or plugin error — waits until
      # someone cuts a release tag, since tauri.conf.json's beforeBuildCommand is
      # this same `npm run build`. That is the worst moment to find out.
      - name: Type-check and build (svelte-check, vite)
        working-directory: frontend
        run: npm run build
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint
      - name: Test (vitest)
        working-directory: frontend
        run: npm test
      - name: i18n locale keys in sync
        run: node scripts/check-i18n-keys.mjs
      # npm advisories, the other half of what the `audit` job below does for the
      # Cargo lockfiles. Here rather than there because this job already has Node
      # and a warm npm cache; a job of its own would set both up again to run one
      # command.
      #   `--audit-level=high` rather than npm's default of moderate. The one
      #   moderate outstanding is esbuild's dev-server advisory
      #   (GHSA-67mh-4wv8-2f99), reached only through svelte-i18n's own nested
      #   copy, and npm's fix for it is a *downgrade* to svelte-i18n 3.7.1 —
      #   gating on it would mean a permanently red build whose only remedy is
      #   worse than the finding. Moderates are still printed either way, so a new
      #   one shows up in the log without being a stop sign.
      # Same command the pre-push hook runs, so an advisory can't first surface
      # here after a push that passed locally.
      - name: Advisories (npm)
        working-directory: frontend
        run: npm audit --audit-level=high

  # Security advisories against both lockfiles — the workspace's and the desktop
  # app's, which is outside the workspace and carries a tree (Tauri, the webview
  # stack) the root lock never sees. `cargo audit` alone reads lockfiles, which
  # are feature-blind and so report crates that are never compiled; the script
  # re-derives that from the resolved graph on every run instead of carrying an
  # ignore list. See its docstring. Same command the pre-push hook runs.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Advisories (both lockfiles)
        run: python3 scripts/check-advisories.py

  # Coverage of the shipped library crates (osp-core, integer-blossom, osp-server),
  # measured with cargo-llvm-cov. Binary entry points (server/src/main.rs) are
  # excluded — they are 0%-by-nature glue that would understate real coverage — and
  # the sim crate (a dev-only Monte-Carlo tool, all binaries) is out of scope
  # entirely. This matches the number the README badge advertises.
  #
  # Informational only: it never fails the build (a coverage dip is a signal, not a
  # gate). The badge is published from main pushes via a Gist, but only once the
  # one-time setup exists (a GIST_TOKEN secret + a COVERAGE_GIST_ID variable, see the
  # README "Coverage" section) — until then the publish step simply skips, so this
  # job stays green with nothing to configure.
  coverage:
    runs-on: ubuntu-latest
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ vars.COVERAGE_GIST_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov -p osp-core -p integer-blossom -p osp-server \
            --ignore-filename-regex 'main\.rs$' \
            --json --output-path coverage.json
          pct=$(jq '.data[0].totals.lines.percent' coverage.json)
          printf 'Line coverage (shipped libs): %.2f%%\n' "$pct"
          printf 'COVERAGE_PCT=%.1f\n' "$pct" >> "$GITHUB_ENV"
      # Skipped until the Gist setup exists (see README), so this never reddens CI.
      - name: Publish coverage badge
        if: ${{ github.ref == 'refs/heads/main' && env.GIST_TOKEN != '' && env.GIST_ID != '' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ env.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: osp-coverage.json
          label: coverage
          message: ${{ env.COVERAGE_PCT }}%
          valColorRange: ${{ env.COVERAGE_PCT }}
          minColorRange: 50
          maxColorRange: 95
