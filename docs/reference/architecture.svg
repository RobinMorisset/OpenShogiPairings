<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 102 556 410" width="556" height="410" role="img" aria-labelledby="title desc">
  <title id="title">OpenShogiPairings crate stack</title>
  <desc id="desc">Five bricks. integer-blossom at the bottom, osp-core resting on it, osp-server and osp-sim side by side on osp-core, and the Svelte frontend on osp-server. A dashed outline encloses everything except osp-sim: that is what the Tauri desktop app packages into one executable.</desc>

  <style>
    .brick-name { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #fff; }
    .brick-sub  { font: 400 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #fff; fill-opacity: .78; }
    .brick      { stroke: #000; stroke-opacity: .22; }
    .boundary   { fill: #7d8fa8; fill-opacity: .08; stroke: #6b7a90; stroke-width: 2; stroke-dasharray: 9 6; }
    .boundary-label { font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #56636f; }
    .note       { font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #67727f; }
    @media (prefers-color-scheme: dark) {
      .boundary       { stroke: #93a2b6; fill-opacity: .10; }
      .boundary-label { fill: #a7b4c4; }
      .note           { fill: #98a4b2; }
      .brick          { stroke: #fff; stroke-opacity: .18; }
    }
  </style>

  <!-- What Tauri packages: everything but osp-sim. The step in the outline is
       the point — osp-sim sits on osp-core too, but ships as its own binary. -->
  <path class="boundary" d="M 32 134 H 348 V 295 H 568 V 456 H 32 Z"/>
  <text class="boundary-label" x="32" y="124">Tauri desktop app — one self-contained executable</text>

  <!-- frontend -->
  <rect class="brick" x="44" y="148" width="290" height="66" rx="5" fill="#b0642c"/>
  <text class="brick-name" x="64" y="180">frontend</text>
  <text class="brick-sub"  x="64" y="198">Svelte 5 + Vite — the browser client</text>

  <!-- osp-server / osp-sim -->
  <rect class="brick" x="44" y="224" width="290" height="66" rx="5" fill="#426e9c"/>
  <text class="brick-name" x="64" y="256">osp-server</text>
  <text class="brick-sub"  x="64" y="274">axum HTTP API — a binary, and a library</text>

  <rect class="brick" x="384" y="224" width="172" height="66" rx="5" fill="#5c6b7d"/>
  <text class="brick-name" x="404" y="256">osp-sim</text>
  <text class="brick-sub"  x="404" y="274">Monte-Carlo simulator</text>

  <!-- osp-core -->
  <rect class="brick" x="44" y="300" width="512" height="66" rx="5" fill="#375180"/>
  <text class="brick-name" x="64" y="332">osp-core</text>
  <text class="brick-sub"  x="64" y="350">the domain, the pairing engine, the DTOs every client shares</text>

  <!-- integer-blossom -->
  <rect class="brick" x="44" y="376" width="512" height="66" rx="5" fill="#293b58"/>
  <text class="brick-name" x="64" y="408">integer-blossom</text>
  <text class="brick-sub"  x="64" y="426">min-weight perfect matching on general graphs — no dependencies</text>

  <text class="note" x="32" y="480">A brick rests on what it links.</text>
  <text class="note" x="32" y="498">osp-sim links osp-core directly and ships as its own CLI, outside the packaged app.</text>
</svg>
