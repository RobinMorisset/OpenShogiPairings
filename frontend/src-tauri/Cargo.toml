[package]
name = "app"
version = "1.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Stale at 1.77.2 (the tauri template's default) until 2026-08: this crate path-
# depends on osp-core, so its real floor has always been the workspace's. Kept in
# step with `rust-version` in the repo-root Cargo.toml by hand — being its own
# workspace, it cannot inherit, and the `msrv` CI job checks the root workspace
# only (building Tauri needs the whole webview toolchain, which that job is
# deliberately too cheap to install).
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# This package is its own single-crate workspace (see also the exclude in the
# repo-root Cargo.toml and the comment there). The empty table stops cargo's
# workspace-ancestor search *here*, which matters in a git worktree checked out
# inside the repo (.claude/worktrees/...): without it, the search walks past the
# worktree into the main checkout's Cargo.toml, whose `exclude` paths don't
# match the worktree copy, and every cargo command on this manifest errors with
# "believes it's in a workspace when it's not".
[workspace]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Strip debug symbols from the release binary so the distributed exe stays small.
# (Deliberately no `panic = "abort"`: a panic in an embedded-server request
# handler should not take down the whole desktop app.)
[profile.release]
strip = true

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Not called from this crate: it is here to *guarantee* `tracing/log`, which is
# what carries the embedded server's `tracing::warn!` (a failed save, a backup
# that won't rotate) into the `log` facade tauri-plugin-log writes to disk. The
# feature happens to be enabled by another crate in the graph today; depending on
# that would mean an unrelated dependency bump could silently take the desktop
# app's only error channel away.
tracing = { version = "0.1", features = ["log"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# The API server, embedded and run in-process so the packaged app is fully
# self-contained (no separate server binary to launch).
osp-server = { path = "../../crates/server" }
tokio = { version = "1", features = ["net", "rt"] }
# Locating the same per-user data directory osp-server's own backups already
# use (see crates/server/src/backup.rs), so the embedded server's persisted
# tournaments live alongside them.
dirs = "5"

# macOS-only: Tauri/wry's native print starts an AppKit modal print operation
# and returns before the page has been rendered, which is no good for the two
# buttons that print a document put into the DOM for the occasion. We build the
# print operation ourselves instead, orientation included (wry never set it, so
# the wide Results table always printed portrait) — see `src/print_macos.rs`.
# Versions pinned to what wry already resolves.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSWindow",
] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
