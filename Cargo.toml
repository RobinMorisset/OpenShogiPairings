[workspace]
resolver = "2"
members = ["crates/core", "crates/matching", "crates/server", "crates/sim"]

# src-tauri is intentionally NOT a workspace member: the Tauri desktop client
# is an optional wrapper that pulls its own heavy dependency tree, and keeping it
# out of the core workspace keeps `cargo build`/`cargo test` fast for the engine
# and server. It is nested under this directory, so it must be explicitly
# excluded or cargo would auto-adopt it into the workspace. It can still depend
# on `osp-core` via a path dependency when needed.
exclude = ["frontend/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/robingeek/OpenShogiPairings"

[workspace.dependencies]
osp-core = { path = "crates/core" }
integer-blossom = { path = "crates/matching" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl"] }
derive_more = { version = "1", features = ["add", "add_assign", "sum", "display"] }
typed-index-collections = "3"
rand = "0.8"
rand_chacha = "0.3"
tracing = "0.1"
