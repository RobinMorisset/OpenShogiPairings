[workspace]
resolver = "2"
members = ["crates/core", "crates/matching", "crates/server", "crates/sim"]

# src-tauri is intentionally NOT a workspace member: the Tauri desktop client
# is an optional wrapper that pulls its own heavy dependency tree, and keeping it
# out of the core workspace keeps `cargo build`/`cargo test` fast for the engine
# and server. It is nested under this directory, so it must be explicitly
# excluded or cargo would auto-adopt it into the workspace. It can still depend
# on `osp-core` via a path dependency when needed.
exclude = ["frontend/src-tauri"]

[workspace.package]
version = "1.4.1"
edition = "2021"
# The oldest Rust that builds this workspace, and the single place that number
# lives — the README quotes it and CI pins a toolchain to it (the `msrv` job in
# .github/workflows/ci.yml), so a dependency that raises the floor fails a build
# instead of quietly making the docs wrong. It is a *maximum* over the dependency
# graph: today `typed-index-collections` is what sets it. Raise it only with the
# evidence that something needs it. `integer-blossom` opts out and declares its
# own lower floor — it has no dependencies, and being buildable further back is
# part of the point of keeping it standalone.
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/RobinMorisset/OpenShogiPairings"

[workspace.dependencies]
osp-core = { path = "crates/core" }
integer-blossom = { path = "crates/matching" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
ts-rs = { version = "12", features = ["uuid-impl"] }
derive_more = { version = "1", features = ["add", "add_assign", "sum", "display"] }
typed-index-collections = "3"
# Default features off so `std_rng` — and with it `rand_chacha` and `ppv-lite86`
# — stay out of the graph of anything that doesn't ask for them. The server takes
# `getrandom` back for `OsRng`; osp-core's simulation needs only the `Rng` trait,
# and osp-sim depends on rand_chacha directly for its seeded replay RNG. Each
# consumer names what it uses, so a crate that stops needing a generator stops
# building it.
rand = { version = "0.8", default-features = false }
rand_chacha = "0.3"
tracing = "0.1"

# Strip the release binaries. Debug symbols are the single largest thing in
# them — measured with `cargo bloat`, `osp-server` is 9.2 MiB of which only
# 4.7 MiB is `.text` — and nothing ships them anywhere they would be read: the
# server and the simulator both run from a build made on the machine that runs
# them, where the object files are still next to the binary.
#
# `true` (= "symbols") rather than "debuginfo", matching what the desktop app
# already does in `frontend/src-tauri/Cargo.toml`. The cost is that a panic
# backtrace in a release build carries addresses instead of names; the server's
# own error paths report through `tracing`, which is unaffected.
[profile.release]
strip = true
# Optimize for size at link time, which costs build time and nothing else.
# `codegen-units = 1` compiles each crate as one unit, so the duplicate generic
# instantiations that 16 units produce independently are emitted once — and
# roughly half of what that saves is not code but the *unwinding metadata*
# attached to it (`__eh_frame`, `__gcc_except_tab`, `__unwind_info`), which every
# copy otherwise carries. Fat LTO then merges the whole graph and takes another
# slice off. Measured on `osp-server`, workspace build, stripped:
#
#   codegen-units = 16 (default)  7.12 MB
#   codegen-units = 1             5.93 MB   -16.6%
#   + lto = "fat"                 5.65 MB   -20.5%
#
# Deliberately *not* traded for anything that matters at run time. The solver —
# the only hot path here — measured 15.2-15.9 ms (n=300) and 112-114 ms (n=600)
# across all three, i.e. unchanged; `opt-level = "z"` was rejected because it
# made the same solve 3.3x slower. `panic = "unwind"` is likewise kept: the
# server catches handler panics with `CatchPanicLayer` and returns an error
# response, which `panic = "abort"` would silently disable.
#
# This only touches `cargo build --release`. Debug builds — the ones run dozens
# of times a day — use `[profile.dev]` and are not affected; the cost lands on
# release builds, which are cut about once a fortnight. Nothing in CI builds
# release, so no pipeline pays for it either.
codegen-units = 1
lto = "fat"
