[package]
name = "osp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "osp_server"
path = "src/lib.rs"

[[bin]]
name = "osp-server"
path = "src/main.rs"

[dependencies]
osp-core = { workspace = true }
tokio = { workspace = true }
# Adapts the tournament-change broadcast channel into a Stream for the SSE
# endpoint (see `live.rs`).
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
axum = "0.8"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "trace", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# FESA ratings fetch. rustls (not native-tls) keeps TLS pure-Rust so the packaged
# app has no system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Locating a per-user cache directory for the persisted ratings list.
dirs = "5"
# Constant-time comparison for the session token, so token checks leak nothing
# through timing (see `auth.rs`).
constant_time_eq = "0.3"
# Hashing per-tournament passwords before they touch disk (see `auth.rs`).
bcrypt = "0.15"
# The OS CSPRNG behind the public reader page's capability key (see `state.rs`).
# `getrandom` is what `rand::rngs::OsRng` lives behind, and it is the only part
# of `rand` this crate touches — the workspace turns the default features off.
rand = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
